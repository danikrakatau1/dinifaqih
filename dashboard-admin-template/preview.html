<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="dini-template-preview-version" content="1.18.0">
<title>Preview Template — Dini Anif</title>
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#272b32;color:#eee;font:14px system-ui}
.state{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box;text-align:center}.state b{display:block;font-size:18px;margin-bottom:8px}.state small{opacity:.7}
#templatePreviewFrame{display:block;width:min(100vw,450px);height:100vh;height:100dvh;margin:0 auto;border:0;background:#fff;box-shadow:0 15px 48px #0008}
@supports not (height:100dvh){#templatePreviewFrame{height:100vh}}
</style>
<script src="/assets/js/canonical-consumer-bridge-v1250.js?v=1250" defer></script>
</head>
<body>
<div class="state" id="state"><div><b>Memuat Preview…</b><small>Exact Saved Snapshot · Source Truth parity · V1.18.0</small></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard-admin-edit/template-canonical-v1160.js?v=1160"></script>
<script src="/assets/js/social-link-parity-v1.js?v=100"></script>
<script>
(async()=>{
  const SUPABASE_URL='https://jfvmcerrsxjvbiogfqes.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_3IqSDxkpxCGiDpxAEwdsXQ_AsJpsC4W';
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const q=new URLSearchParams(location.search).get('template')||'';
  const fail=(msg)=>{const state=document.getElementById('state');if(state)state.innerHTML='<div><b>Preview gagal</b><small>'+String(msg).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</small></div>'};
  const sourceTruthVersion=value=>Number(
    value?.manifest?.source_graph?.source_truth_version ??
    value?.manifest?.source_truth_package_version ??
    value?.source_graph?.source_truth_version ??
    value?.source_truth_version ?? 0
  )||0;
  const isSourceTruth=value=>sourceTruthVersion(value)>=1;
  const dirname=raw=>{try{const u=new URL(raw,location.href);if(/\.[a-z0-9]{1,8}$/i.test(u.pathname.split('/').pop()||''))u.pathname=u.pathname.replace(/[^/]*$/,'');if(!u.pathname.endsWith('/'))u.pathname+='/';u.search='';u.hash='';return u.href}catch{return ''}};
  const embeddedBase=(html,manifest={},fallback='')=>{
    try{const doc=new DOMParser().parseFromString(String(html||''),'text/html');const raw=String(doc.querySelector('base')?.getAttribute('href')||'').trim();if(raw){const d=dirname(new URL(raw,manifest.source_url||fallback||location.href).href);if(d)return d}}catch{}
    const source=String(manifest.source_url||'').trim();if(source){const d=dirname(source);if(d)return d}
    const current=String(manifest.asset_base||'').trim();if(current){const d=dirname(current);if(d)return d}
    return dirname(fallback)||location.origin+'/';
  };
  const isTemplate1=row=>String(row?.slug||'').toLowerCase()==='template-1';
  const appendRuntime=(html,blocks)=>{
    const block=(blocks||[]).filter(Boolean).join('');
    if(!block)return html;
    return /<\/body>/i.test(html)?html.replace(/<\/body>/i,block+'</body>'):html+block;
  };
  const injectAuthority=(html,payload)=>{
    if(!payload)return html;
    const json=JSON.stringify(payload).replace(/</g,'\\u003c').replace(/-->/g,'--\\>');
    const block='<script type="application/json" id="diniSnapshotAuthorityData">'+json+'<\/script><script src="/dashboard-admin-edit/template-canonical-v1160.js?v=1160"><\/script><script src="/dashboard-admin-template/snapshot-authority-v1162.js?v=1162"><\/script>';
    return /<\/body>/i.test(html)?html.replace(/<\/body>/i,block+'</body>'):html+block;
  };
  const renderInEditorViewport=html=>{
    const frame=document.createElement('iframe');
    frame.id='templatePreviewFrame';
    frame.title='Exact Template Preview · Editor viewport parity';
    frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads');
    frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
    frame.srcdoc=String(html||'');
    document.body.replaceChildren(frame);
    document.documentElement.dataset.previewViewport='editor-max-450';
  };
  async function localTemplate1Snapshot(stamp){
    const u=new URL('/template-1-original/editor-snapshot.json',location.origin);
    u.searchParams.set('_preview',String(stamp||Date.now()));
    const r=await fetch(u.href,{cache:'no-store'});
    if(!r.ok)throw new Error('Template 1 local snapshot HTTP '+r.status);
    return r.json();
  }
  async function loadSnapshot(row,manifest){
    const snapUrl=String(manifest.editor_snapshot_url||'').trim();
    if(snapUrl){
      try{
        const su=new URL(snapUrl,location.href);su.searchParams.set('_preview',String(row.updated_at||Date.now()));
        const sr=await fetch(su.href,{cache:'no-store'});if(!sr.ok)throw new Error('Editor Snapshot HTTP '+sr.status);
        return await sr.json();
      }catch(err){
        if(!isTemplate1(row))throw err;
        console.warn('Template 1 cloud snapshot fallback:',err);
      }
    }
    if(isTemplate1(row))return localTemplate1Snapshot(row.updated_at);
    return null;
  }
  try{
    if(!q)throw new Error('Template tidak ditentukan.');
    const isUuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(q);
    const res=isUuid?await sb.from('templates').select('id,name,slug,source_path,updated_at,manifest_json').eq('id',q).limit(1).maybeSingle():await sb.from('templates').select('id,name,slug,source_path,updated_at,manifest_json').eq('slug',q).limit(1).maybeSingle();
    if(res.error)throw res.error;const row=res.data;if(!row)throw new Error('Template tidak ditemukan.');
    const source=String(row.source_path||'').trim();

    let html='',manifest={...(row.manifest_json||{})},authority=null,sourceTruthExact=false;
    let snap=await loadSnapshot(row,manifest);
    if(snap){
      if(snap?.template_id&&String(snap.template_id)!==String(row.id))throw new Error('Snapshot template mismatch.');
      sourceTruthExact=isSourceTruth(snap);
      if(!sourceTruthExact&&window.DINI_TEMPLATE_CANONICAL_V1160?.resolveSnapshot)snap=window.DINI_TEMPLATE_CANONICAL_V1160.resolveSnapshot(snap);
      html=String(snap?.html||snap?.baseHtml||'');if(!html)throw new Error('Editor Snapshot tidak memiliki HTML.');
      manifest={...manifest,...(snap.manifest||{})};
      if(!sourceTruthExact){
        authority={schema:snap.schema||{},values:snap.values||{},transforms:snap.transforms||{},persistent:true,template_id:row.id,revision:snap.revision||manifest.revision||''};
      }
    }else{
      if(!source||source==='/')throw new Error('Template ini belum memiliki source snapshot yang dapat dipreview.');
      const u=new URL(source,location.href);u.searchParams.set('_preview',String(row.updated_at||Date.now()));
      const r=await fetch(u.href,{cache:'no-store'});if(!r.ok)throw new Error('Snapshot HTML '+r.status);html=await r.text();
    }

    const template1=isTemplate1(row);
    const assetBase=template1?(location.origin+'/'):embeddedBase(html,manifest,source);
    html=html.replace(/<base\b[^>]*data-dini-template-base[^>]*>/ig,'').replace(/<base\b[^>]*>/ig,'');
    html=html.replace(/<head(\s[^>]*)?>/i,m=>m+'<base data-dini-template-base="1" href="'+assetBase.replace(/"/g,'&quot;')+'">');

    if(template1){
      const rev=encodeURIComponent(row.updated_at||Date.now());
      html=html.replace(/((?:src|href)=["'])(?:https?:\/\/[^/"']+)?(\/assets\/(?:js|css)\/[^"'?#]+)(?:\?[^"']*)?(["'])/gi,(_,a,path,q2)=>a+path+'?_tpl='+rev+q2);
      if(!/\/assets\/css\/style\.css/i.test(html)){
        html=html.replace(/<\/head>/i,'<link rel="stylesheet" href="/assets/css/style.css?_tpl='+rev+'"></head>');
      }
    }

    if(sourceTruthExact){
      const blocks=['<script>document.documentElement.dataset.diniSourceTruthPreview="1";document.documentElement.dataset.diniPreviewCompatibility="source-truth-exact-plus-runtime-compat";<\/script>'];
      if(!/source-truth-runtime-compat-v1\.js/i.test(html))blocks.push('<script src="/assets/js/source-truth-runtime-compat-v1.js?v=103"><\/script>');
      html=appendRuntime(html,blocks);
      document.documentElement.dataset.previewPackagePolicy='exact-source-truth-snapshot';
    }else{
      html=injectAuthority(html,authority);
      document.documentElement.dataset.previewPackagePolicy='legacy-canonical-compatibility';
    }
    renderInEditorViewport(html);
  }catch(e){fail(e.message||String(e));}
})();
</script>
</body>
</html>
