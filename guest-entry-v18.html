<body>
<div class="state dini-premium-loader" id="diniPublicState" aria-live="polite" aria-busy="true">
  <div class="dini-premium-loader__inner">
    <img class="dini-premium-loader__logo" src="/assets/branding/loader-dini-faqih.svg?v=120" alt="DINI & FAQIH" width="1200" height="360" decoding="async" fetchpriority="high">
    <p class="dini-premium-loader__copy">Menyiapkan undangan spesial...</p>
    <span class="dini-premium-loader__dot" aria-hidden="true"></span>
  </div>
</div>
<script src="/assets/js/public-source-truth-renderer-v1.js?v=186"></script>
<script>
(()=>{
  const invitationId='17a598bd-13be-4a18-82e6-b0506a85a3b3';

  let frame=null;
  let frameLoadBound=false;
  let observer=null;
  let done=false;

  const bind=()=>{
    if(done)return true;
    const api=window.DiniFaqihPublicActions;
    frame=frame||document.getElementById('diniPublicCanonicalFrame');
    if(!api||!frame)return false;

    if(!frameLoadBound){
      frameLoadBound=true;
      frame.addEventListener('load',bind,{passive:true});
    }

    let guestName='',guestSlug='';
    try{
      const raw=frame.contentDocument?.getElementById('diniGuestRuntimeData')?.textContent||'';
      const parsed=raw?JSON.parse(raw):null;
      guestName=String(parsed?.name||'').trim();
      guestSlug=String(parsed?.slug||parsed?.guest_slug||'').trim();
    }catch{}

    const context={invitationId,guestName,guestSlug};
    api.setContext(context);
    api.bindFrame(frame,context);

    if(frame.contentDocument?.documentElement&&guestName){
      done=true;
      observer?.disconnect();
      observer=null;
      document.documentElement.dataset.publicActionBridge='guest-bound';
      document.documentElement.dataset.publicBootBinding='event-ready';
      return true;
    }
    return false;
  };

  const watch=()=>{
    if(bind())return;
    observer=new MutationObserver(()=>bind());
    try{observer.observe(document.body||document.documentElement,{childList:true,subtree:true})}catch{}
    [120,500,1500,4000].forEach(ms=>setTimeout(bind,ms));
    setTimeout(()=>{observer?.disconnect();observer=null},6000);
  };

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch,{once:true});
  else watch();
})();
</script>
</body>
</html>
