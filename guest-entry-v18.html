<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">

<title>Undangan Faqih & Dini</title>
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff;color:#3a2a22;font:14px system-ui;overflow:hidden}
.state{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}
.state b{font-size:19px;display:block;margin-bottom:7px}.state small{opacity:.72}
</style>
<link rel="preload" href="/assets/branding/loader-dini-faqih.svg?v=100" as="image" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/loader-dini-faqih.css?v=100">
<script>window.DINI_PUBLIC_ENTRY={mode:'guest',invitationId:'17a598bd-13be-4a18-82e6-b0506a85a3b3'};</script>
<script src="/dashboard-admin-edit/template-canonical-v1160.js?v=1160"></script>
<script src="/dashboard-admin-edit/template-baseline-authority-v1.js?v=110"></script>
<script src="/assets/js/legacy-parity-gate-v1.js?v=100"></script>
<script src="/assets/js/social-link-parity-v1.js?v=100"></script>
<script>window.DINI_LEGACY_PARITY_GATE_V1?.finalize?.()</script>
<script src="/assets/js/canonical-consumer-bridge-v1250.js?v=1250" defer></script>
<script src="/assets/js/source-consumer-contract-v1.js?v=101"></script>
<script src="/assets/js/public-action-bridge-v1.js?v=120" defer></script>
</head>
<body>
<div class="state dini-premium-loader" id="diniPublicState" aria-live="polite" aria-busy="true">
  <div class="dini-premium-loader__inner">
    <img class="dini-premium-loader__logo" src="/assets/branding/loader-dini-faqih.svg?v=100" alt="DINI & FAQIH" width="1200" height="360" decoding="async" fetchpriority="high">
    <p class="dini-premium-loader__copy">Menyiapkan undangan spesial...</p>
    <span class="dini-premium-loader__dot" aria-hidden="true"></span>
  </div>
</div>
<script src="/assets/js/public-source-truth-renderer-v1.js?v=130"></script>
<script>
(()=>{
  const invitationId='17a598bd-13be-4a18-82e6-b0506a85a3b3';
  let tries=0;
  const bind=()=>{
    tries++;
    const api=window.DiniFaqihPublicActions;
    const frame=document.getElementById('diniPublicCanonicalFrame');
    if(!api||!frame)return false;

    let guestName='';
    try{
      const raw=frame.contentDocument?.getElementById('diniGuestRuntimeData')?.textContent||'';
      guestName=raw?String(JSON.parse(raw)?.name||'').trim():'';
    }catch{}

    const context={invitationId,guestName};
    api.setContext(context);
    api.bindFrame(frame,context);
    document.documentElement.dataset.publicActionBridge='guest-bound';

    return !!frame.contentDocument?.documentElement && !!guestName;
  };
  const timer=setInterval(()=>{if(bind()||tries>=160)clearInterval(timer)},75);
  bind();
})();
</script>
</body>
</html>
