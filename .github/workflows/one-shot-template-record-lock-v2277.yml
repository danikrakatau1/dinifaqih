name: one-shot template UUID record lock v2.27.7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-template-record-lock-v2277.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UUID record-lock patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          code = base64.b64decode('...TRUNCATED_FOR_BREVITY...')
          exec(compile(code, '<v2277>', 'exec'))
          PY
      - name: Syntax checks
        run: |
          node --check dashboard-admin-fetch/studio.js
          node --check dashboard-admin-edit/exact-source-preview-v2275.js
          node --check dashboard-admin-edit/editor.js
          git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "danikrakatau1"
          git config user.email "danikrakatau1@gmail.com"
          git rm .github/workflows/one-shot-template-record-lock-v2277.yml
          git add dashboard-admin-template/index.html dashboard-admin-template/preview.html dashboard-admin-fetch/studio.js dashboard-admin-edit/editor.js dashboard-admin-edit/exact-source-preview-v2275.js
          git commit -m "fix: lock every template edit to immutable record UUID v2.27.7"
          git push origin main
