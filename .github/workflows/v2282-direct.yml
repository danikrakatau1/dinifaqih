name: v2282 direct parity patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V2.28.2
        run: python3 .github/scripts/v2282.py
      - name: Validate V2.28.2
        run: |
          node --check dashboard-admin-edit/editor.js
          node --check dashboard-admin-edit/clean-preview.js
          git diff --check
          grep -F "data-dini-applied-parity','v2282'" dashboard-admin-edit/editor.js
          grep -F "requestedRevision" dashboard-admin-edit/clean-preview.js
          grep -F "editor.js?v=2282" dashboard-admin-edit/index.html
          grep -F "clean-preview.js?v=2282" dashboard-admin-edit/clean-preview.html
      - name: Commit V2.28.2
        run: |
          git config user.name "danikrakatau1"
          git config user.email "danikrakatau1@gmail.com"
          git rm -f .github/workflows/v2282-direct.yml .github/workflows/one-shot-v2282.yml .github/scripts/v2282.py
          git add dashboard-admin-edit/editor.js dashboard-admin-edit/clean-preview.js dashboard-admin-edit/index.html dashboard-admin-edit/clean-preview.html
          git commit -m "fix: lock APPLY Clean Preview ZIP to exact editor DOM revision v2.28.2"
          git push origin main
