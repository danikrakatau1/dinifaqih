name: Fix exact template edit handoff

on:
  push:
    paths:
      - '.github/workflows/fix-exact-template-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch exact template edit flow
        shell: bash
        run: |
          echo ' nOwogICAgY29uc3QgdGFyZ2V0PXFzLmdldCgnc291cmNlJyl8fCc nOwogICAgaWYoIXRlbXBsYXRlfHwhdGFyZ2V0KXt0b2FzdCgnVGVtcGxhdGUvc291cmNlIHRpZGFrIGxlbmdrYXAuJywnZXJyb3InLCdBdXRvIEVkaXQgZ2FnYWwnKTtyZXR1cm59CiAgICBjb25zdCB0PXRvYXN0KCdNZW1iYW5ndW4gZWRpdG9yIGRhcmkgc291cmNlIHlhbmcgc2FtYSBkZW5nYW4gUHJldmlld+KApi  ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Syntax and invariant checks
        shell: bash
        run: |
          node --check dashboard-admin-edit/editor.js
          node --check dashboard-admin-fetch/studio.js
          grep -Fq 'autoEdit=1&template=' dashboard-admin-template/index.html
          grep -Fq 'SOURCE GRAPH LOADED' dashboard-admin-edit/editor.js
          grep -Fq 'autoEditFromTemplate' dashboard-admin-fetch/studio.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'danikrakatau1'
          git config user.email '320639863+danikrakatau1@users.noreply.github.com'
          git add dashboard-admin-template/index.html dashboard-admin-fetch/studio.js dashboard-admin-edit/editor.js
          if git diff --cached --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git commit -m 'fix: rebuild editor from exact selected template source'
          git push origin main
