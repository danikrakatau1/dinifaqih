name: one-shot exact visual parity pipeline v2.28.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply parity patch
        run: python3 .github/scripts/v2280.py
      - name: Syntax and parity invariant checks
        run: |
          node --check dashboard-admin-edit/editor.js
          node --check dashboard-admin-edit/exact-source-preview-v2275.js
          node --check dashboard-admin-edit/clean-preview.js
          git diff --check
          grep -F "html=captureLiveParityHtml()" dashboard-admin-edit/editor.js
          grep -F "&download=1" dashboard-admin-edit/editor.js
          grep -F "get('download')==='1'" dashboard-admin-edit/clean-preview.js
          ! grep -F "centerOpenButtons" dashboard-admin-edit/exact-source-preview-v2275.js
      - name: Commit production parity patch
        run: |
          git config user.name "danikrakatau1"
          git config user.email "danikrakatau1@gmail.com"
          git rm -f .github/workflows/one-shot-parity-pipeline-v2280.yml .github/scripts/v2280.py
          git add dashboard-admin-edit/editor.js dashboard-admin-edit/exact-source-preview-v2275.js dashboard-admin-edit/clean-preview.js
          git commit -m "fix: unify Preview Editor Apply Clean Download visual parity v2.28.0"
          git push origin main
