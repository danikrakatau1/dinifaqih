name: Hotfix Large Source Preview V2.27.3
on:
  push:
    paths:
      - '.github/workflows/hotfix-large-source-preview-v2273.yml'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch large source preview renderer
        shell: bash
        run: |
          echo '

||||IXd8fCFi||||


' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: JavaScript syntax check
        run: node --check dashboard-admin-edit/editor.js
      - name: Preview renderer invariants
        shell: bash
        run: |
          grep -q "largeSource=html.length>450000" dashboard-admin-edit/editor.js
          grep -q "data-dini-blank-overlay-disabled" dashboard-admin-edit/editor.js
          grep -q "content-security-policy" dashboard-admin-edit/editor.js
          grep -q "new Blob(\[html\]" dashboard-admin-edit/editor.js
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "danikrakatau1"
          git config user.email "320639863+danikrakatau1@users.noreply.github.com"
          git add dashboard-admin-edit/editor.js
          git commit -m "fix: render large selected templates reliably on mobile v2.27.3"
          git push origin main
