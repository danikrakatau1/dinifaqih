name: Hotfix Editor White Preview V2.27.3

on:
  push:
    paths:
      - '.github/workflows/hotfix-editor-white-preview-v2273.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply editor runtime parity patch
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: JavaScript syntax checks
        run: |
          node --check dashboard-admin-edit/editor.js
          node --check dashboard-admin-fetch/studio.js
          git diff --check

      - name: Runtime parity invariants
        run: |
          grep -q 'function stabilizeExactTemplateFrame()' dashboard-admin-edit/editor.js
          grep -q 'EXACT_TEMPLATE_PREVIEW_STILL_BLANK' dashboard-admin-edit/editor.js
          grep -q 'Editor-safe initial-state hydration' dashboard-admin-fetch/studio.js
          grep -q "btnVisibleAfterLoad','native-visible" dashboard-admin-fetch/studio.js

      - name: Commit production fix
        run: |
          git config user.name 'danikrakatau1'
          git config user.email '320639863+danikrakatau1@users.noreply.github.com'
          git add dashboard-admin-edit/editor.js dashboard-admin-fetch/studio.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: restore source cover visibility in editor v2.27.3'
            git push origin main
          fi
