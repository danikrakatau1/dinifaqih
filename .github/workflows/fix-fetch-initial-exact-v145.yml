name: Fix Fetch Initial Exact V145
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-fetch-initial-exact-v145.py'
      - '.github/workflows/fix-fetch-initial-exact-v145.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact first-render fix
        run: python .github/scripts/fix-fetch-initial-exact-v145.py
      - name: Syntax check
        run: node --check dashboard-admin-edit/editor.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-admin-edit/editor.js dashboard-admin-edit/index.html
          git rm --ignore-unmatch .github/scripts/fix-fetch-initial-exact-v145.py .github/workflows/fix-fetch-initial-exact-v145.yml
          git commit -m 'fix: render exact Source-Native HTML first in Fetch Editor v1.4.5'
          git push
