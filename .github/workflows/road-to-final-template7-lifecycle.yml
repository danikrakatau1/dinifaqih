name: Road To Final — Template 7 Lifecycle Regression

on:
  push:
    branches:
      - engine/road-to-final-dini-faqih
    paths:
      - '.github/scripts/template7-lifecycle-regression-v2.mjs'
      - '.github/workflows/road-to-final-template7-lifecycle.yml'
      - 'golden-tests/template-7/**'
      - 'assets/js/visual-resolver.js'
      - 'assets/js/source-truth-scanner-v1.js'
      - 'assets/js/source-runtime-compiler-v1.js'
      - 'assets/js/source-runtime-authority-v1.js'
      - 'assets/js/legacy-parity-gate-v1.js'
      - 'assets/js/social-link-parity-v1.js'
      - 'assets/js/media-source-parity-v1.js'
      - 'assets/js/source-native-background-parity-v1.js'
      - 'dashboard-admin-fetch/index.html'
      - 'dashboard-admin-fetch-editor/index.html'
      - 'dashboard-admin-fetch-editor/fetch-runtime-control-v1.js'
      - 'dashboard-admin-edit/index.html'
      - 'ROAD-TO-FINAL-PHASE-4-STATUS.md'
      - 'ROAD-TO-FINAL-PHASE-4-LIFECYCLE.txt'
  pull_request:
    paths:
      - '.github/scripts/template7-lifecycle-regression-v2.mjs'
      - '.github/workflows/road-to-final-template7-lifecycle.yml'
      - 'golden-tests/template-7/**'
      - 'assets/js/visual-resolver.js'
      - 'assets/js/source-truth-scanner-v1.js'
      - 'assets/js/source-runtime-compiler-v1.js'
      - 'assets/js/source-runtime-authority-v1.js'
      - 'assets/js/legacy-parity-gate-v1.js'
      - 'assets/js/social-link-parity-v1.js'
      - 'assets/js/media-source-parity-v1.js'
      - 'assets/js/source-native-background-parity-v1.js'
      - 'dashboard-admin-fetch/index.html'
      - 'dashboard-admin-fetch-editor/index.html'
      - 'dashboard-admin-fetch-editor/fetch-runtime-control-v1.js'
      - 'dashboard-admin-edit/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Template 7 · lifecycle · ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Inspect persisted Source Truth authority
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          (async()=>{
            const f=JSON.parse(fs.readFileSync('golden-tests/template-7/fixture.json','utf8'));
            const url=new URL('manifest.json',f.artifact_base).href;
            const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(30000)});
            if(!r.ok) throw new Error(`manifest HTTP ${r.status}`);
            const b=Buffer.from(await r.arrayBuffer());
            const pin=f.artifacts['manifest.json'];
            const hash=crypto.createHash('md5').update(b).digest('hex');
            if(b.length!==pin.bytes||hash!==pin.md5) throw new Error(`manifest pin mismatch ${b.length}/${hash}`);
            const m=JSON.parse(b.toString('utf8'));
            const g=m.source_graph||{};
            const l=g.lifecycle||{};
            const safe=l.safe_plan||{};
            const delays=[];
            for(const x of l.timers||[]) if(Number.isFinite(Number(x?.delay_ms))) delays.push(Number(x.delay_ms));
            for(const x of safe.on_open||[]) if(Number.isFinite(Number(x?.delay_ms))) delays.push(Number(x.delay_ms));
            console.log('PERSISTED_SOURCE_TRUTH='+JSON.stringify({
              source_truth_version:g.source_truth_version||0,
              authority:g.authority?.editor_rule||'',
              lifecycle_keys:Object.keys(l),
              counts:l.counts||{},
              timers:Array.isArray(l.timers)?l.timers.length:0,
              events:Array.isArray(l.events)?l.events.length:0,
              actions:Array.isArray(l.actions)?l.actions.length:0,
              safe_plan_present:Boolean(l.safe_plan),
              safe_on_open:Array.isArray(safe.on_open)?safe.on_open.length:0,
              delays:[...new Set(delays)].sort((a,b)=>a-b).slice(0,30),
              runtime_policy:g.runtime_policy||null
            }));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --save-dev playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Syntax-check lifecycle runner V2
        run: node --check .github/scripts/template7-lifecycle-regression-v2.mjs

      - name: Run behavioral lifecycle regression V2
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
          NODE_NO_WARNINGS: '1'
        run: node .github/scripts/template7-lifecycle-regression-v2.mjs

      - name: Print lifecycle summary
        if: always()
        shell: bash
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          REPORT="lifecycle-artifacts/${BROWSER_ENGINE}/report.json"
          if [ -f "$REPORT" ]; then
            node -e "const r=require('./' + process.argv[1]); console.log(JSON.stringify({browser:r.browser,ok:r.ok,checks_total:r.checks_total,checks_passed:r.checks_passed,checks_failed:r.checks_failed},null,2))" "$REPORT"
          fi

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template7-lifecycle-v2-${{ matrix.browser }}-${{ github.sha }}
          path: lifecycle-artifacts/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14
