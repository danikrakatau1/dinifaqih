name: Fix exact handoff preview guard

on:
  push:
    paths:
      - '.github/workflows/fix-exact-handoff-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch source handoff blank guard
        shell: bash
        run: |
          echo ' aWYgb2xkIG5vdCBpbiBzOgogICAgcmFpc2UgU3lzdGVtRXhpdCgiYmxhbmsgZ3VhcmQgYW5jaG9yIG5vdCBmb3VuZCIpCnMgPSBzLnJlcGxhY2Uob2xkLCBuZXcsIDEpCnAud3JpdGVfdGV4dChzLCBlbmNvZGluZz0idXRmLTgiKQo='.replace(' ','') | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Verify JavaScript
        shell: bash
        run: |
          node --check dashboard-admin-edit/editor.js
          grep -Fq 'Exact-template handoff: legacy blank guard skipped' dashboard-admin-edit/editor.js

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'danikrakatau1'
          git config user.email '320639863+danikrakatau1@users.noreply.github.com'
          git add dashboard-admin-edit/editor.js
          git commit -m 'fix: keep exact template preview during source hydration'
          git push origin main
