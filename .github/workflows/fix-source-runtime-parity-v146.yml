name: Fix Source Runtime Parity V146
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-source-runtime-parity-v146.py'
      - '.github/workflows/fix-source-runtime-parity-v146.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime parity patch
        run: python .github/scripts/fix-source-runtime-parity-v146.py
      - name: Syntax checks
        run: |
          node --check dashboard-admin-fetch/studio.js
          node --check dashboard-admin-edit/editor.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-admin-fetch/studio.js dashboard-admin-fetch/preview.html dashboard-admin-edit/editor.js dashboard-admin-edit/index.html
          git rm --ignore-unmatch .github/scripts/fix-source-runtime-parity-v146.py .github/workflows/fix-source-runtime-parity-v146.yml
          git commit -m 'fix: freeze source scripts and preserve editable Source-Native runtime v1.4.6'
          git push
