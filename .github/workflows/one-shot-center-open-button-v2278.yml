name: one-shot center open button v2.27.8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-center-open-button-v2278.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch editor opener alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard-admin-edit/editor.js')
          s=p.read_text(encoding='utf-8')
          old="open.style.setProperty('display','block','important');open.style.setProperty('visibility','visible','important');open.style.setProperty('opacity','1','important');open.style.setProperty('transform','none','important');open.style.setProperty('pointer-events','auto','important')"
          new="open.style.setProperty('display','block','important');open.style.setProperty('margin-left','auto','important');open.style.setProperty('margin-right','auto','important');open.style.setProperty('visibility','visible','important');open.style.setProperty('opacity','1','important');open.style.setProperty('transform','none','important');open.style.setProperty('pointer-events','auto','important')"
          if old not in s:
              raise SystemExit('open-button stabilizer anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('V2.27.8 opener centering patch applied')
          PY
      - name: Syntax checks
        run: |
          node --check dashboard-admin-edit/editor.js
          git diff --check
          grep -F "margin-left','auto','important" dashboard-admin-edit/editor.js
          grep -F "margin-right','auto','important" dashboard-admin-edit/editor.js
      - name: Commit and clean helper
        run: |
          git config user.name "danikrakatau1"
          git config user.email "danikrakatau1@gmail.com"
          git rm .github/workflows/one-shot-center-open-button-v2278.yml
          git add dashboard-admin-edit/editor.js
          git commit -m "fix: keep invitation open button centered in editor v2.27.8"
          git push origin main
