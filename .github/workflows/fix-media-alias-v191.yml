name: Fix Media Alias V1.9.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[media-alias-v1.9.1]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch editor media targeting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard-admin-edit/editor.js')
          s=p.read_text(encoding='utf-8')
          old="""     let fs=[];const direct=editableNode(e.target);if(direct)fs=[...proxyFields(direct),...fieldsForNode(direct)];"""
          new="""     let fs=[];
     const directImg=e.target?.closest?.('img[data-native-edit-id],img[data-native-edit-ids],img[data-native-node-id]');
     if(directImg){
       fs=[...fieldsForNode(directImg),...proxyFields(directImg)];
       fs.sort((a,b)=>(b.kind==='image'?1:0)-(a.kind==='image'?1:0));
     }else{
       const direct=editableNode(e.target);if(direct)fs=[...fieldsForNode(direct),...proxyFields(direct)];
     }"""
          if old not in s:
              raise SystemExit('direct media target anchor not found')
          s=s.replace(old,new,1)
          old2=""" function uploadFor(id,accept){const inp=document.createElement('input');inp.type='file';inp.accept=accept||'*/*';inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;pushHistory();const name=f.name.replace(/[^a-zA-Z0-9._-]+/g,'-');generatedAssets.set(id,{blob:f,name,type:f.type||'application/octet-stream',path:'assets/generated/'+id+'-'+name,source:'upload'});setDirty('Perubahan asset belum di-APPLY');liveApply(id);renderNativeEditor();selectField(id,false);editorToast(`${f.name} siap dan akan ikut Production ZIP.`,'success','Upload sukses')};inp.click()}"""
          new2=""" function linkedMediaAliasIds(id){
   const f=fieldById(id);if(!f||!native)return[id];
   const kinds=new Set(['image','background']);
   if(!kinds.has(f.kind))return[id];
   const doc=liveDoc(),node=doc&&nodeFor(doc,f);
   const host=node?.closest?.('[data-id],.elementor-widget,.elementor-element')||node?.parentElement||null;
   const original=String(native.values[id]??f.value??'').trim();
   const ids=[];
   for(const x of native.schema.fields||[]){
     if(!kinds.has(x.kind))continue;
     if(x.id===id){ids.push(x.id);continue}
     const xv=String(native.values[x.id]??x.value??'').trim();
     if(!original||xv!==original)continue;
     let linked=!!(f.node_id&&x.node_id&&f.node_id===x.node_id)||!!(f.source_element_id&&x.source_element_id&&f.source_element_id===x.source_element_id);
     if(!linked&&host&&doc){const xn=nodeFor(doc,x);linked=!!(xn&&(host.contains(xn)||xn.contains?.(host)))}
     if(linked)ids.push(x.id)
   }
   return [...new Set(ids.length?ids:[id])]
 }
 function uploadFor(id,accept){const inp=document.createElement('input');inp.type='file';inp.accept=accept||'*/*';inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;pushHistory();const name=f.name.replace(/[^a-zA-Z0-9._-]+/g,'-');const asset={blob:f,name,type:f.type||'application/octet-stream',path:'assets/generated/'+id+'-'+name,source:'upload'};const aliases=linkedMediaAliasIds(id);for(const aid of aliases)generatedAssets.set(aid,asset);setDirty('Perubahan asset belum di-APPLY');for(const aid of aliases)liveApply(aid);renderNativeEditor();selectField(id,false);editorToast(`${f.name} siap · ${aliases.length} linked layer tersinkron dan akan ikut Production ZIP.`,'success','Upload sukses')};inp.click()}"""
          if old2 not in s:
              raise SystemExit('uploadFor anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-admin-edit/editor.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: direct photo targeting + linked media aliases [media-alias-v1.9.1]"
          git push
