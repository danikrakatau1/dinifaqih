name: one-shot parity and delete repair v2.28.1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/v2281.py
      - name: Validate
        run: |
          node --check dashboard-admin-edit/editor.js
          node --check dashboard-admin-edit/force-visible-v2274.js
          node --check dashboard-admin-edit/preview-rescue.js
          node --check dashboard-admin-edit/exact-source-preview-v2275.js
          node --check api/b2-sign-delete.js
          git diff --check
          grep -F "get('handoff')==='1')return" dashboard-admin-edit/force-visible-v2274.js
          grep -F "get('handoff')==='1')return" dashboard-admin-edit/preview-rescue.js
          grep -F "v=2281" dashboard-admin-edit/index.html
          grep -F "berhasil dihapus dari library" dashboard-admin-template/index.html
      - name: Commit production repair
        run: |
          git config user.name "danikrakatau1"
          git config user.email "danikrakatau1@gmail.com"
          git rm -f .github/workflows/one-shot-v2281.yml .github/scripts/v2281.py
          git add dashboard-admin-edit/editor.js dashboard-admin-edit/force-visible-v2274.js dashboard-admin-edit/preview-rescue.js dashboard-admin-edit/index.html dashboard-admin-template/index.html
          git commit -m "fix: exact preview editor parity and resilient template delete v2.28.1"
          git push origin main
