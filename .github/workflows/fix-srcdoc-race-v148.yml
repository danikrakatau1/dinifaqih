name: Fix Fetch Editor Srcdoc Race V148

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-srcdoc-race-v148.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove blank srcdoc navigation race
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('dashboard-admin-edit/editor.js')
          s = p.read_text(encoding='utf-8')

          old1 = """   frame.removeAttribute('src');
   frame.srcdoc='';
   requestAnimationFrame(()=>{frame.srcdoc=html});"""
          new1 = """   frame.removeAttribute('src');
   // V1.4.8: assign the exact Fetch HTML in one navigation. Clearing srcdoc first can race
   // with the real srcdoc navigation in Chromium and leave the iframe committed to an empty DOM.
   frame.srcdoc=html;"""
          if old1 in s:
              s = s.replace(old1, new1, 1)
          else:
              raise SystemExit('Fetch srcdoc race marker not found')

          old2 = "frame.removeAttribute('src');frame.srcdoc='';requestAnimationFrame(()=>{frame.srcdoc=html})"
          new2 = "frame.removeAttribute('src');frame.srcdoc=html"
          if old2 in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')

          ip = Path('dashboard-admin-edit/index.html')
          h = ip.read_text(encoding='utf-8')
          import re
          h = re.sub(r'\.\/editor\.js\?v=[^\"\']+', './editor.js?v=fetch-srcdoc-148', h, count=1)
          ip.write_text(h, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          node --check dashboard-admin-edit/editor.js
          ! grep -Fq "frame.srcdoc='';" dashboard-admin-edit/editor.js
          grep -Fq "frame.srcdoc=html" dashboard-admin-edit/editor.js
          grep -Fq "fetch-srcdoc-148" dashboard-admin-edit/index.html

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- dashboard-admin-edit/editor.js dashboard-admin-edit/index.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-admin-edit/editor.js dashboard-admin-edit/index.html
          git commit -m "fix: remove Fetch Editor srcdoc blank navigation race v1.4.8"
          git push origin main
