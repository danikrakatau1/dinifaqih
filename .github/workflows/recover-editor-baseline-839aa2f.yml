name: Recover Editor Baseline 839aa2f

on:
  push:
    paths:
      - '.github/workflows/recover-editor-baseline-839aa2f.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good core
        run: python3 scripts/recover-editor-baseline.py
      - name: Syntax checks
        run: |
          node --check dashboard-admin-edit/editor.js
          node --check dashboard-admin-edit/clean-preview.js
          node --check dashboard-admin-fetch/studio.js
          node --check dashboard-admin-fetch/preview-studio.js
      - name: Recovery invariants
        run: |
          grep -q 'generateAsset(fieldId' dashboard-admin-edit/editor.js
          grep -q 'Upload / Ganti' dashboard-admin-edit/editor.js
          grep -q 'ensureRuntimeCssBackgroundFields' dashboard-admin-edit/editor.js
          grep -q 'source-native-rebuild-v2.26-smart-source-ownership' dashboard-admin-fetch/studio.js
          grep -q 'renderPreview(force=false)' dashboard-admin-edit/editor.js
          grep -q 'rebuildHtml({forExport:true})' dashboard-admin-edit/editor.js
          test ! -d dashboard-admin-edit-v229
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'recovery: restore known-good editable engine 839aa2f with UUID lock'
          git push origin HEAD:main
