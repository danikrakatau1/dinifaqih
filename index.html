<html lang="id">
<head>
<meta charset="utf-8">

<meta name="dini-public-renderer" content="source-truth-v1-home">
<title>Faqih & Dini</title>
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff;color:#3a2a22;font:14px system-ui;overflow:hidden}
.state{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}
.state b{font-size:19px;display:block;margin-bottom:7px}.state small{opacity:.72}
</style>
<link rel="preload" href="/assets/branding/loader-dini-faqih.svg?v=110" as="image" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/loader-dini-faqih.css?v=110">
<script>window.DINI_PUBLIC_ENTRY={mode:'public',invitationId:'17a598bd-13be-4a18-82e6-b0506a85a3b3'};</script>
<script src="/dashboard-admin-edit/template-canonical-v1160.js?v=1160"></script>
<script src="/assets/js/canonical-consumer-bridge-v1250.js?v=1250" defer></script>
<script src="/assets/js/source-truth-runtime-compat-v1.js?v=101" defer></script>
</head>
<body>
<div class="state dini-premium-loader" id="diniPublicState" aria-live="polite" aria-busy="true">
  <div class="dini-premium-loader__inner">
    <img class="dini-premium-loader__logo" src="/assets/branding/loader-dini-faqih.svg?v=110" alt="DINI & FAQIH" width="1200" height="360" decoding="async" fetchpriority="high">
    <p class="dini-premium-loader__copy">Menyiapkan undangan spesial...</p>
    <span class="dini-premium-loader__dot" aria-hidden="true"></span>
  </div>
</div>
<script src="/assets/js/public-source-truth-renderer-v1.js?v=177"></script>
<script src="/assets/js/public-action-bridge-v1.js?v=121"></script>
<script>
(()=>{
  const invitationId='17a598bd-13be-4a18-82e6-b0506a85a3b3';
  window.__INVITATION_ID__=invitationId;
  window.DiniFaqihPublicActions?.setContext?.({invitationId});

  let tries=0;
  const sync=()=>{
    tries++;
    try{
      const frame=document.getElementById('diniPublicCanonicalFrame');
      const doc=frame?.contentDocument;
      const compatApi=window.DINI_SOURCE_TRUTH_RUNTIME_COMPAT_V1;
      const actionApi=window.DiniFaqihPublicActions;

      if(frame&&actionApi?.bindFrame){
        actionApi.bindFrame(frame,{invitationId});
      }

      if(doc?.querySelector?.('[data-id="678f991a"]')&&compatApi?.applyDocument){
        compatApi.applyDocument(doc);
        if(doc.documentElement?.getAttribute('data-dini-source-truth-runtime-compat'))return true;
      }
    }catch{}
    return false;
  };
  const timer=setInterval(()=>{if(sync()||tries>=120)clearInterval(timer)},80);
  sync();
})();
</script>
</body>
</html>
