<title>Faqih & Dini</title>
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff;color:#3a2a22;font:14px system-ui;overflow:hidden}
.state{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}
.state b{font-size:19px;display:block;margin-bottom:7px}.state small{opacity:.72}
</style>
<link rel="preload" href="/assets/branding/loader-dini-faqih.svg?v=120" as="image" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/loader-dini-faqih.css?v=130">
<script>window.DINI_PUBLIC_ENTRY={mode:'public',invitationId:'17a598bd-13be-4a18-82e6-b0506a85a3b3'};</script>
<script src="/dashboard-admin-edit/template-canonical-v1160.js?v=1160"></script>
<script src="/assets/js/canonical-consumer-bridge-v1250.js?v=1252" defer></script>
<script src="/assets/js/source-truth-runtime-compat-v1.js?v=125" defer></script>
</head>
<body>
<div class="state dini-premium-loader" id="diniPublicState" aria-live="polite" aria-busy="true">
  <div class="dini-premium-loader__inner">
    <img class="dini-premium-loader__logo" src="/assets/branding/loader-dini-faqih.svg?v=120" alt="DINI & FAQIH" width="1200" height="360" decoding="async" fetchpriority="high">
    <p class="dini-premium-loader__copy">Menyiapkan undangan spesial...</p>
    <span class="dini-premium-loader__dot" aria-hidden="true"></span>
  </div>
</div>
<script src="/assets/js/public-source-truth-renderer-v1.js?v=221"></script>
<script src="/assets/js/public-action-bridge-v1.js?v=124"></script>
<script>
(()=>{
  const invitationId='17a598bd-13be-4a18-82e6-b0506a85a3b3';
  window.__INVITATION_ID__=invitationId;

  let frame=null;
  let frameLoadBound=false;
  let observer=null;
  let done=false;

  const sync=()=>{
    if(done)return true;
    try{
      frame=frame||document.getElementById('diniPublicCanonicalFrame');
      if(!frame)return false;

      if(!frameLoadBound){
        frameLoadBound=true;
        frame.addEventListener('load',sync,{passive:true});
      }

      const actionApi=window.DiniFaqihPublicActions;
      actionApi?.setContext?.({invitationId});
      actionApi?.bindFrame?.(frame,{invitationId});

      const doc=frame.contentDocument;
      const compatApi=window.DINI_SOURCE_TRUTH_RUNTIME_COMPAT_V1;
      if(doc?.querySelector?.('[data-id="678f991a"]')&&compatApi?.applyDocument){
        compatApi.applyDocument(doc);
      }

      const compatReady=!!doc?.documentElement?.getAttribute('data-dini-source-truth-runtime-compat');
      const actionReady=!!actionApi?.bindFrame;
      if(compatReady&&actionReady){
        done=true;
        observer?.disconnect();
        observer=null;
        document.documentElement.dataset.publicBootBinding='event-ready';
        return true;
      }
    }catch{}
    return false;
  };

  const watch=()=>{
    if(sync())return;
    observer=new MutationObserver(()=>sync());
    try{observer.observe(document.body||document.documentElement,{childList:true,subtree:true})}catch{}
    [120,500,1500,4000].forEach(ms=>setTimeout(sync,ms));
    setTimeout(()=>{observer?.disconnect();observer=null},6000);
  };

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch,{once:true});
  else watch();
})();
</script>
</body>
</html>
